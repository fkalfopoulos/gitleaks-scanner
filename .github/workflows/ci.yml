name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      # -warnaserror: αν λείπει XML documentation από public member, το build αποτυγχάνει.
      - name: Build
        run: dotnet build GitleaksScanner.slnx -warnaserror

      - name: Test
        run: dotnet test GitleaksScanner.slnx --logger "console;verbosity=normal"
